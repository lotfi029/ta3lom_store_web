name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI has no access to the API repo: build, e2e smoke and a11y run against scripts/stub-api.mjs (DECISIONS: CI).
      STORE_API_URL: http://localhost:3000/v1
      NG_CLI_ANALYTICS: 'false'
      NG_FORCE_TTY: 'false'
      E2E_PORT: '4320'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are current
        run: npm run types:check
      - run: npm run typecheck
      - name: Lint (ESLint, Stylelint, contrast, no-commerce guard, i18n ids)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Start the stub API
        run: |
          node scripts/stub-api.mjs > stub-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health/ready && break; sleep 1; done
      - name: Build (both locales, prerender, budgets, CSP, deploy output)
        run: npm run build:ci
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: e2e smoke (stub API)
        run: npx playwright test --grep @smoke
      - name: a11y (ar/en × light/dark)
        run: npm run a11y
      - name: Production is blocked while payments are off (D-W2)
        run: '! node scripts/check-payments-flag.mjs'
      - name: Production build dry run (stub data, runtime API = production; payments guard skipped — never deployed)
        env:
          PRERENDER_API_URL: http://localhost:3000/v1
          ALLOW_PAYMENTS_DISABLED: '1'
        run: npm run build:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            stub-api.log
          retention-days: 7
