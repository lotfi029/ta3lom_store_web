# Dependency updates (owner brief P3): npm (Angular grouped), GitHub Actions (pinned by SHA) and the Docker base images.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10
    ignore:
      # @angular/build 22.x requires typescript >=6.0 <6.1; TypeScript 7 broke `npm ci` on main (#26). Lift this with the
      # Angular major that supports it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # @lhci/cli 0.16 brings Lighthouse 13, which reports ~100 ms more TBT than Lighthouse 12 on the same build (local
      # A/B on one build: /ar/ 182 → 262 ms, /en/ 168 → 288 ms); the LHCI floors (lighthouserc.json) were set on
      # Lighthouse 12. Lift this together with re-measured floors (DECISIONS: CI Lighthouse 13).
      - dependency-name: '@lhci/cli'
        versions: ['>=0.16.0']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', '@angular-eslint/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/test', 'playwright', '@axe-core/*', 'axe-core', '@lhci/cli']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
