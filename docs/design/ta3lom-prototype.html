<title>Ta3lom Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --brand:#1A96C1; --brand-700:#137AA0; --brand-900:#136578; --gold:#A58E36; --gold-700:#8C7729; --gold-200:#C3AF72;
  --ink:#232123; --ink-2:#3A3D3E; --muted:#6E7476;
  --bg:#FFFFFF; --gray:#F4F7F8; --gray-2:#E9EFF1; --line:#DCE4E7; --tint:#EEF6FA; --tint-2:#D6ECF5;
  --indigo:#0E3D4C; --black:#0F262E; --green:#1E8E5A; --danger:#C8413B; --warn:#B4661A;
  --grad:linear-gradient(-87deg,#C3AF72 0%,#1A96C1 52%,#5CC4E6 108%);
  --r:12px; --rc:16px; --rp:999px;
  --fa:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --fe:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fa);font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
html[dir=ltr] body{font-family:var(--fe);line-height:1.55}
h1,h2,h3,h4{margin:0;font-weight:400;line-height:1.15;text-wrap:balance}
h3,h4{font-weight:500}
p{margin:0;max-width:66ch}
a{color:var(--brand)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
img,svg,video{max-width:100%}
.mono{font-family:var(--fm)}
[hidden],.hidden{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.proto{background:var(--black);color:#9FB4BC;font-family:var(--fm);font-size:11px;letter-spacing:.05em;padding:6px 0;text-align:center}
.proto b{color:var(--gold-200);font-weight:500}
.proto a{color:#fff;margin-inline-start:12px;text-decoration:none;border-bottom:1px solid var(--gold-200)}

.hdr{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);position:sticky;top:0;z-index:50;transition:box-shadow .25s}
.hdr.scrolled{box-shadow:0 1px 0 var(--line),0 8px 30px rgba(19,101,120,.07)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand .mark{width:46px;height:40px;flex:none;transition:transform .4s var(--ease)}
.brand:hover .mark{transform:translateY(-2px) scale(1.05)}
.brand .nm{font-weight:600;font-size:1rem;line-height:1.2}
.brand .sub{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.nav{display:none;gap:2px;margin-inline-start:auto}
@media(min-width:1080px){.nav{display:flex}}
.nav a,.nav button{font:inherit;font-size:.9rem;color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:var(--rp);background:none;border:0;cursor:pointer;line-height:1.3;transition:background .2s}
.nav a:hover,.nav button:hover,.nav a.on,.nav button.on{background:var(--gray-2)}
.nav a.on{font-weight:500}
.nav .dd{position:relative}
.nav .dd .car{display:inline-block;width:6px;height:6px;border-inline-end:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-inline-start:8px;position:relative;top:-3px;transition:transform .2s}
.nav .dd:hover .car{transform:rotate(225deg);top:0}
.nav .menu{position:absolute;top:calc(100% + 8px);inset-inline-start:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;min-width:250px;opacity:0;visibility:hidden;transform:translateY(8px);transition:all .25s var(--ease);box-shadow:0 20px 50px rgba(19,101,120,.14)}
.nav .dd:hover .menu,.nav .dd:focus-within .menu{opacity:1;visibility:visible;transform:none}
.nav .menu a{display:block;padding:9px 12px;border-radius:10px}
.nav .menu a:hover{background:var(--tint);color:var(--brand)}
.acts{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
@media(min-width:1080px){.acts{margin-inline-start:0}}
.lang{font:inherit;font-size:.85rem;font-weight:500;background:none;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:var(--rp);cursor:pointer;font-family:var(--fe)}
.lang:hover{border-color:var(--ink)}
.burger{display:inline-flex;flex-direction:column;gap:4px;background:none;border:0;padding:10px;cursor:pointer}
.burger span{width:20px;height:2px;background:var(--ink)}
@media(min-width:1080px){.burger{display:none}}
.mnav{display:none;background:#fff;border-bottom:1px solid var(--line);padding:10px 24px 18px}
.mnav.open{display:block}
.mnav a{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}
.mnav .grp{font-size:.75rem;color:var(--muted);padding-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:.95rem;padding:11px 20px;border-radius:var(--r);border:1px solid transparent;text-decoration:none;cursor:pointer;line-height:1.3;transition:all .2s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-700);box-shadow:0 10px 26px rgba(26,150,193,.3)}
.btn-cta{background:var(--gold);color:#fff}
.btn-cta:hover{background:var(--gold-700);box-shadow:0 10px 26px rgba(165,142,54,.35)}
.btn-white{background:#fff;color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-hero{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-hero:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn-lite{background:var(--gray-2);color:var(--ink)}
.btn-danger{background:transparent;color:var(--danger)}
.btn-danger:hover{background:#FBEAEA}
.btn.sm{padding:8px 14px;font-size:.88rem}
.btn.xs{padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn .arr{display:inline-block;transition:transform .2s var(--ease)}
html[dir=rtl] .btn .arr{transform:scaleX(-1)}
.btn:hover .arr{transform:translateX(4px)}
html[dir=rtl] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}

section{padding:72px 0}
@media(min-width:900px){section{padding:100px 0}}
.eyebrow{display:inline-block;font-size:.8rem;font-weight:500;color:var(--brand);margin-bottom:12px;padding:4px 12px;border-radius:var(--rp);background:var(--tint)}
.sec-title{font-size:clamp(1.9rem,4vw,3rem);line-height:1.12;margin-bottom:14px}
.sec-lede{color:var(--muted);font-size:1.1rem;max-width:60ch}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 32px;margin-bottom:40px}
.sec-head.center{flex-direction:column;align-items:center;text-align:center}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g2,.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--gray);border-radius:var(--rc);padding:22px;display:flex;flex-direction:column;gap:10px;transition:all .35s var(--ease)}
.card h3{font-size:1.12rem}
.card p{font-size:.94rem;color:var(--muted)}
.card .more{margin-top:auto;font-weight:500;font-size:.92rem;color:var(--brand);text-decoration:none}
.card.link{cursor:pointer;text-decoration:none;color:inherit}
.card.link:hover{background:#fff;transform:translateY(-6px);box-shadow:0 24px 50px rgba(19,101,120,.12)}
.card.white{background:#fff;border:1px solid var(--line)}
.tag{display:inline-block;font-size:.74rem;font-weight:500;padding:4px 11px;border-radius:var(--rp);background:var(--tint);color:var(--brand)}
.tag.gold{background:#F6F1E2;color:var(--gold-700)}
.date{font-family:var(--fm);font-size:.76rem;color:var(--muted)}

.hero{background:var(--indigo);color:#fff;position:relative;overflow:hidden;padding:0}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 520px at 50% -10%,rgba(26,150,193,.6),transparent 60%),radial-gradient(700px 400px at 85% 70%,rgba(195,175,114,.22),transparent 60%);animation:glow 14s ease-in-out infinite alternate}
@keyframes glow{to{transform:translate3d(0,-30px,0) scale(1.06)}}
.hero-logo{position:absolute;inset-inline-end:-6%;top:8%;width:min(46vw,560px);opacity:.07;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(-1deg)}}
.hero .wrap{position:relative;z-index:1;padding-block:72px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.4rem);line-height:1.1;color:#fff;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--gold-200)}
.hero p{color:rgba(255,255,255,.78);font-size:1.1rem;margin:22px auto 30px;max-width:56ch}
.hero .cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.hero .guar{margin-top:18px;font-size:.85rem;color:rgba(255,255,255,.7);display:flex;gap:8px;align-items:center}
.search{display:flex;align-items:center;background:#fff;border-radius:var(--rp);padding:6px 6px 6px 22px;width:min(640px,100%);margin:34px auto 0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
html[dir=rtl] .search{padding:6px 22px 6px 6px}
.search input{border:0;background:none;flex:1;font:inherit;font-size:.95rem;padding:8px 0;box-shadow:none}
.search input:focus{outline:none;box-shadow:none}
.h-in{opacity:0;transform:translateY(22px);animation:up .9s var(--ease) forwards}
.h-in:nth-child(2){animation-delay:.08s}.h-in:nth-child(3){animation-delay:.16s}.h-in:nth-child(4){animation-delay:.24s}.h-in:nth-child(5){animation-delay:.32s}.h-in:nth-child(6){animation-delay:.4s}.h-in:nth-child(7){animation-delay:.5s}
@keyframes up{to{opacity:1;transform:none}}

.acc{display:flex;gap:10px;width:100%;height:300px;margin-top:50px;align-items:stretch}
@media(min-width:900px){.acc{height:380px;gap:12px}}
.acc .ac{flex:1;min-width:0;border-radius:16px 16px 0 0;background:rgba(0,0,0,.22);position:relative;overflow:hidden;cursor:pointer;transition:flex-grow .55s var(--ease),background .4s;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:#fff}
.acc .ac.on{flex-grow:3.2;background:rgba(0,0,0,.35)}
.acc .ac .art{position:absolute;inset:0;opacity:.9}
.acc .ac .art svg,.acc .ac .art img{width:100%;height:100%;object-fit:cover;display:block}
.acc .ac .lbl{position:relative;padding:18px;background:linear-gradient(transparent,rgba(15,38,46,.88))}
.acc .ac .lbl b{display:block;font-weight:500;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .ac .lbl span{display:block;font-size:.85rem;color:rgba(255,255,255,.7);max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease),opacity .4s .1s}
.acc .ac.on .lbl span{max-height:60px;opacity:1}
.acc .ac .num{position:absolute;top:14px;inset-inline-start:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-family:var(--fm);font-size:.75rem}
.acc .ac.on .num{background:var(--brand)}
@media(max-width:700px){.acc .ac:not(.on) .lbl b{writing-mode:vertical-rl;transform:rotate(180deg);max-height:180px}}

.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:32px 0}
@media(min-width:900px){.pillars{grid-template-columns:repeat(4,1fr)}}
.pillar{background:var(--gray);border-radius:var(--rc);padding:22px;text-decoration:none;color:inherit;display:flex;gap:14px;align-items:center;transition:all .3s var(--ease)}
.pillar:hover{background:var(--tint);transform:translateY(-3px)}
.pillar .ic{width:40px;height:40px;flex:none;color:var(--brand);background:#fff;border-radius:12px;padding:8px}
.pillar b{display:block;font-size:.98rem;font-weight:500}
.pillar span{font-size:.84rem;color:var(--muted)}

.stat{padding:28px 26px;background:var(--gray);border-radius:var(--rc)}
.stat .n{font-size:2.8rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{display:block;font-weight:500;margin-top:10px}
.stat .s{display:block;color:var(--muted);font-size:.85rem}

.tile{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--tint);position:relative}
.tile svg,.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card.link:hover .tile svg,.card.link:hover .tile img{transform:scale(1.06)}
.tile .play{position:absolute;inset:0;display:grid;place-items:center}
.tile .play span{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.card.link:hover .play span{transform:scale(1.12)}
.tile .dur{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.65);color:#fff;font-family:var(--fm);font-size:.72rem;padding:2px 7px;border-radius:6px}

.dark{background:var(--black);color:#fff}
.dark .sec-title{color:#fff}
.dark .sec-lede{color:rgba(255,255,255,.65)}
.dark .card{background:#16303A}
.dark .card p{color:rgba(255,255,255,.6)}
.dark .card.link:hover{background:#1D3F4B;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.dark .tag,.dark .eyebrow{background:rgba(195,175,114,.16);color:var(--gold-200)}

.ph{background:var(--gray);padding:52px 0 44px}
.ph h1{font-size:clamp(2rem,4.6vw,3.2rem)}
.ph p{color:var(--muted);margin-top:12px;font-size:1.05rem}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-block:14px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.subnav a{white-space:nowrap;text-decoration:none;color:var(--ink);font-size:.9rem;padding:7px 14px;border-radius:var(--rp)}
.subnav a.on{background:var(--ink);color:#fff;font-weight:500}
.subnav a:hover:not(.on){background:var(--gray-2)}

.prose{max-width:70ch}
.prose h2{font-size:1.6rem;margin:34px 0 12px}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:1.2rem;margin:26px 0 10px}
.prose p{margin-bottom:14px;color:var(--ink-2)}
.prose ul,.prose ol{padding-inline-start:1.3em;color:var(--ink-2)}
.prose li{margin-bottom:6px}
.prose blockquote{border-inline-start:3px solid var(--brand);padding-inline-start:16px;margin:16px 0;color:var(--muted)}
.prose code{background:var(--gray-2);padding:2px 6px;border-radius:5px;font-size:.88em}
.prose img{border-radius:12px;margin:16px 0}
.prose a{text-decoration:underline}
.prose table{width:100%;border-collapse:collapse;font-size:.92rem;margin:16px 0}
.prose th,.prose td{padding:8px 12px;border:1px solid var(--line);text-align:start}
.split{display:grid;grid-template-columns:1fr;gap:40px}
@media(min-width:960px){.split{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.aside{background:var(--gray);border-radius:var(--rc);padding:24px;position:sticky;top:88px}
.aside h4{margin-bottom:8px;font-size:1.02rem}
.aside p{font-size:.92rem;color:var(--muted);margin-bottom:12px}

.doc{display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:10px;border-radius:14px;background:var(--gray);text-decoration:none;color:inherit;transition:all .25s var(--ease)}
.doc:hover{background:var(--tint)}
.doc .ic{width:36px;height:42px;flex:none;color:var(--brand)}
.doc .t{font-weight:500;display:block}
.doc .m{font-size:.8rem;color:var(--muted);font-family:var(--fm)}
.doc .dl{margin-inline-start:auto;font-size:.85rem;font-weight:500;color:var(--brand);white-space:nowrap}

.person{display:flex;gap:16px;align-items:flex-start;background:var(--gray);border-radius:var(--rc);padding:18px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:600;font-size:1.2rem;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.person b{display:block;font-weight:500}
.person .ti{font-size:.88rem;color:var(--muted)}
.person .br{font-size:.88rem;color:var(--ink-2);margin-top:6px}
.person .ct{font-family:var(--fm);font-size:.8rem;color:var(--brand);margin-top:6px;display:block}
.orgchart{display:flex;flex-direction:column;align-items:center;margin-top:30px}
.orgchart .lvl{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.orgchart .box{background:var(--gray);border-radius:12px;padding:10px 18px;font-weight:500;font-size:.92rem;text-align:center;min-width:150px}
.orgchart .box.top{background:var(--brand);color:#fff}
.orgchart .v{width:1px;height:26px;background:var(--line)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.filters button{font:inherit;font-size:.9rem;padding:7px 16px;border-radius:var(--rp);border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
.filters button:hover{border-color:var(--ink)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}

.form{display:grid;gap:18px;max-width:640px}
.field{display:grid;gap:6px}
.field label{font-weight:500;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.field .warn{font-size:.8rem;color:var(--warn);background:#FBF3E9;border-radius:8px;padding:8px 12px;display:flex;gap:8px;align-items:flex-start}
input,select,textarea{font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;transition:all .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(26,150,193,.12);outline:none}
textarea{min-height:120px;resize:vertical}
.row2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:600px){.row2{grid-template-columns:1fr 1fr}}
.edgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.edgrid{grid-template-columns:1fr 1fr}}
.edgrid .full,.form .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:9px;font-size:.92rem;font-weight:500;cursor:pointer;background:var(--gray);border-radius:10px;padding:11px 14px;align-self:end}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--brand);padding:0}
.edbox{background:#fff;border-radius:var(--rc);padding:22px;margin-bottom:20px;border:2px solid var(--brand);box-shadow:0 20px 50px rgba(19,101,120,.12)}
.edbox h3{font-size:1.05rem;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:200;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--danger)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s;background:#fff}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--tint);color:var(--ink)}
.drop input{display:none}
.drop b{display:block;color:var(--brand);font-size:1rem;font-weight:500}

.donate-box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;max-width:640px;box-shadow:0 30px 70px rgba(19,101,120,.08)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--gray-2);padding:4px;border-radius:var(--rp);margin-bottom:22px}
.seg button{font:inherit;font-size:.88rem;font-weight:500;padding:9px 4px;border:0;border-radius:var(--rp);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}

/* Reference counting — ADR-007: never delete an asset in use */
function assetRefs(id){
  const r=[];
  DB.programs.forEach(p=>{if(p.thumb===id)r.push(pick(p.titleAr,p.titleEn)+' — '+(lang==='ar'?'صورة مصغّرة':'thumbnail'));(p.atts||[]).forEach(a=>{if(a.a===id)r.push(pick(p.titleAr,p.titleEn)+' — '+t().admin.attsT)})});
  DB.posts.forEach(p=>{if(p.thumb===id)r.push(pick(p.titleAr,p.titleEn)+' — '+(lang==='ar'?'صورة مصغّرة':'thumbnail'));(p.atts||[]).forEach(a=>{if(a.a===id)r.push(pick(p.titleAr,p.titleEn)+' — '+t().admin.attsT)})});
  DB.videos.forEach(v=>{if(v.thumb===id)r.push(pick(v.titleAr,v.titleEn))});
  DB.documents.forEach(d=>{if(d.asset===id)r.push(pick(d.titleAr,d.titleEn))});
  DB.partners.forEach(p=>{if(p.logo===id)r.push(pick(p.nameAr,p.nameEn))});
  DB.leadership.forEach(l=>{if(l.photo===id)r.push(pick(l.nameAr,l.nameEn))});
  /* R2: an icon uploaded for a contact/social channel is a MediaAsset
     reference too — deleting it must not silently break a footer icon. */
  DB.channels.forEach(c=>{if(c.iconId===id)r.push(pick(c.labelAr,c.labelEn)+' — '+(lang==='ar'?'أيقونة':'icon'))});
  return r;
}
function catRefs(id){
  const c=cat(id);if(!c)return 0;
  if(c.scope==='program')return DB.programs.filter(p=>p.cat===id).length;
  if(c.scope==='post')return DB.posts.filter(p=>p.cat===id).length;
  return DB.videos.filter(v=>v.cat===id).length;
}

/* R2: leadership-type tree — reference counting (members + child units) and
   the two guards a real hierarchy needs: no cycles, and a bounded depth so
   the org-chart page stays renderable. */
function leadTypeRefs(id){
  return {members:DB.leadership.filter(l=>l.typeId===id).length,children:leadTypeChildren(id).length};
}
// Is `candidateId` id itself, or a descendant of it? Used to stop a type
// being reparented under its own subtree (which would make the tree an
// unrenderable cycle).
function leadTypeIsSelfOrDescendant(id,candidateId){
  if(id===candidateId)return true;
  return leadTypeChildren(id).some(c=>leadTypeIsSelfOrDescendant(c.id,candidateId));
}
// Depth of `id` if its parent becomes `parentId` (root = 1). Walks the
// candidate parent's own ancestor chain rather than id's current one, so
// this answers "how deep would it be after this edit", not "how deep is it
// now" — what edSave needs to enforce the three-level cap before saving.
function leadTypeDepthIfParent(parentId){
  let depth=1,p=parentId?leadType(parentId):null,guard=0;
  while(p&&guard++<10){depth++;p=p.parentId?leadType(p.parentId):null}
  return depth;
}
// How many extra levels hang below `id` today (0 for a leaf, or a brand new
// id with no children yet). Needed because reparenting a unit can push its
// OWN children past the depth cap even when the unit itself stays within it
// — moving a unit that already has a sub-unit is what this catches.
function leadTypeSubtreeMaxDepth(id){
  const kids=leadTypeChildren(id);
  if(!kids.length)return 0;
  return 1+Math.max(...kids.map(k=>leadTypeSubtreeMaxDepth(k.id)));
}

/* Generated placeholder art — stands in for real photography */
const PAL=['#1A96C1','#136578','#A58E36','#0E3D4C','#5CC4E6','#C3AF72'];
function artSVG(seed,face){
  const s=seed||1,a=PAL[s%PAL.length],b=PAL[(s+2)%PAL.length];
  if(face)return `<svg viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" fill="${a}" opacity=".18"/><circle cx="100" cy="78" r="34" fill="${a}"/><path d="M30 200c8-42 34-62 70-62s62 20 70 62z" fill="${b}"/></svg>`;
  return `<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="${a}" opacity=".12"/><rect width="320" height="180" fill="url(#dots)" opacity=".35"/><circle cx="${70+s*9%80}" cy="${100-s*3%40}" r="52" fill="url(#hg)" opacity=".9"/><rect x="${150+s*5%40}" y="${44+s%20}" width="108" height="98" rx="20" fill="none" stroke="${b}" stroke-width="3" opacity=".65"/><rect x="${172+s*5%40}" y="${66+s%20}" width="58" height="54" rx="13" fill="${b}" opacity=".85"/></svg>`;
}
/* Renders an asset: real blob if uploaded, else generated art */
function assetImg(id,cls){
  const a=asset(id);
  if(!a)return '';
  if(a.blob&&BLOBS[a.blob])return `<img src="${BLOBS[a.blob]}" alt="${esc(pick(a.altAr,a.altEn))}" class="${cls||''}">`;
  if(a.kind==='pdf')return `<div style="display:grid;place-items:center;height:100%;color:var(--brand)">${iconDoc}</div>`;
  return artSVG(a.seed,a.face);
}
function thumbOf(id,fallbackSeed){
  const a=asset(id);
  if(a)return assetImg(id);
  return artSVG(fallbackSeed||1);
}
function altOf(id){const a=asset(id);return a?pick(a.altAr,a.altEn):''}

/* Minimal Markdown → HTML. Mirrors the ADR-008 allow-list:
   no raw HTML, no h1, links restricted, images via the media endpoint. */
function md(src){
  if(!src)return '';
  let s=esc(src);
  const blocks=s.split(/\n{2,}/).map(b=>b.trim()).filter(Boolean).map(b=>{
    if(/^###\s/.test(b))return '<h3>'+inline(b.replace(/^###\s/,''))+'</h3>';
    if(/^##\s/.test(b))return '<h2>'+inline(b.replace(/^##\s/,''))+'</h2>';
    if(/^#\s/.test(b))return '<h2>'+inline(b.replace(/^#\s/,''))+'</h2>';  /* h1 downgraded — the page owns it */
    if(/^&gt;\s?/m.test(b))return '<blockquote>'+inline(b.replace(/^&gt;\s?/gm,''))+'</blockquote>';
    if(/^[-*]\s/m.test(b))return '<ul>'+b.split('\n').filter(l=>/^[-*]\s/.test(l)).map(l=>'<li>'+inline(l.replace(/^[-*]\s/,''))+'</li>').join('')+'</ul>';
    if(/^\d+\.\s/m.test(b))return '<ol>'+b.split('\n').filter(l=>/^\d+\.\s/.test(l)).map(l=>'<li>'+inline(l.replace(/^\d+\.\s/,''))+'</li>').join('')+'</ol>';
    return '<p>'+inline(b.replace(/\n/g,'<br>'))+'</p>';
  });
  return blocks.join('');
  function inline(x){
    return x
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,alt,src)=>/^\/media\//.test(src)?`<img src="${src}" alt="${alt}">`:`<em>[${lang==='ar'?'صورة خارجية مرفوضة':'external image rejected'}]</em>`)
      .replace(/\[([^\]]+)\]\(((?:https?:|mailto:|\/)[^)]+)\)/g,'<a href="$2" rel="noopener noreferrer">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }
}

// R2: social media row — one <a> per published `social` channel, icon from
// its uploaded MediaAsset (iconId) when set, else a lettered fallback bubble
// (same idiom as person()'s avatar). Shared by the footer and the contact
// page so a channel added in the dashboard appears in both with no other
// change — that no-code-change behaviour is the whole point of the feature.
function socialLinks(cls){
  const items=chans().filter(c=>c.type==='social');
  if(!items.length)return '';
  return `<div class="soc${cls?' '+cls:''}">${items.map(c=>{
    const label=pick(c.labelAr,c.labelEn);
    const ic=c.iconId&&asset(c.iconId)?assetImg(c.iconId):esc(label).slice(0,1);
    return `<a href="${esc(c.url||'#')}" target="_blank" rel="noopener noreferrer" title="${esc(label)}" aria-label="${esc(label)}">${ic}</a>`;
  }).join('')}</div>`;
}

   <h2 style="font-size:1.6rem;margin:34px 0 12px">${s.aboutKinds.value}</h2></div>
   <aside class="aside rv"><h4>${s.about.governance}</h4><p>${lang==='ar'?'تلتزم الجمعية بنشر سياساتها ولوائحها بشفافية كاملة.':'The association publishes its policies and bylaws in full.'}</p><a class="btn btn-primary sm" href="${href('about/governance')}">${s.about.governance} ${arrow()}</a></aside></div>
   <div class="grid g3 rv-stagger" style="margin-top:10px">${aboutOf('value').map(v=>`<div class="card"><h3>${esc(pick(v.titleAr,v.titleEn))}</h3><p>${esc(pick(v.bodyAr,v.bodyEn))}</p></div>`).join('')}</div>`;
 } else if(sub==='leadership'){
  // R2: driven entirely by the leadershipTypes tree — no fixed type list,
  // so a unit an editor adds in the dashboard appears here with no code
  // change, at whatever depth it was placed (root, unit, or sub-unit).
  const person=l=>`<div class="person"><div class="avatar">${l.photo?assetImg(l.photo):esc(pick(l.nameAr,l.nameEn).replace(/^(د\.|أ\.|م\.|Dr\.|Eng\.)\s*/,'').slice(0,1))}</div><div><b>${esc(pick(l.nameAr,l.nameEn))}</b><span class="ti">${esc(pick(l.titleAr,l.titleEn))}</span>${l.briefAr||l.briefEn?`<p class="br">${esc(pick(l.briefAr,l.briefEn))}</p>`:''}${l.phone?`<span class="ct" dir="ltr">${esc(l.phone)}</span>`:''}${l.email?`<span class="ct" dir="ltr">${esc(l.email)}</span>`:''}</div></div>`;
  // One section per type: its own members (a single member gets the narrow
  // list layout, several get the card grid — matching the old hand-picked
  // layouts without hardcoding which type gets which), then its published
  // children recursed underneath at a smaller heading size. A type with
  // neither members nor visible children renders nothing.
  const leadSection=(ty,depth)=>{
   const members=pubLeadOfType(ty.id);
   const kids=pubLeadTypeChildren(ty.id).map(c=>leadSection(c,depth+1)).join('');
   if(!members.length&&!kids)return '';
   const heading=`<h2 class="sec-title rv" style="font-size:${depth?'1.2rem':'1.5rem'};margin-top:${depth?'28px':'44px'}">${esc(pick(ty.nameAr,ty.nameEn))}</h2>`;
   const list=!members.length?'':members.length===1
     ?`<div class="rv" style="max-width:640px">${members.map(person).join('')}</div>`
     :`<div class="grid g3 rv-stagger">${members.map(person).join('')}</div>`;
   return heading+list+kids;
  };
  const roots=pubLeadTypeChildren(null);
  // Org chart: one flattened row per GLOBAL depth (assembly, then every
  // published root, then every published child of a published root, and
  // so on) — the same shape the old hand-typed 4-row chart had, just built
  // from real data instead of copy. Rows with nothing published are skipped.
  const lvl2=roots.flatMap(r=>pubLeadTypeChildren(r.id));
  const lvl3=lvl2.flatMap(r=>pubLeadTypeChildren(r.id));
  const orgLevels=[[{nameAr:'الجمعية العمومية',nameEn:'General assembly'}],roots,lvl2,lvl3].filter(l=>l.length);
  const orgChart=orgLevels.length<2?'':`<div class="orgchart rv">${orgLevels.map((l,i)=>(i?'<div class="v"></div>':'')+`<div class="lvl">${l.map(x=>`<div class="box${i===0?' top':''}">${esc(pick(x.nameAr,x.nameEn))}</div>`).join('')}</div>`).join('')}</div>`;
  body=roots.map(r=>leadSection(r,0)).join('')+
   (orgChart?`<h2 class="sec-title rv" style="font-size:1.5rem;margin-top:44px">${lang==='ar'?'الهيكل التنظيمي':'Organisational structure'}</h2>${orgChart}`:'');
 } else if(sub==='beneficiaries'){
  const g=page('about/beneficiaries');
  body=`<div class="split"><div class="prose rv">${md(g?pick(g.bodyAr,g.bodyEn):'')}<a class="btn btn-primary" style="margin-top:14px" href="${href('programs')}">${s.nav.programs} ${arrow()}</a></div>
   <aside class="aside rv"><span class="eyebrow">${lang==='ar'?'إجمالي المستفيدين حتى 2024':'Total beneficiaries through 2024'}</span><div class="stat" style="padding:0;background:none"><span class="n" data-count="${DB.stats.reduce((a,x)=>a+x.ben,0)}">0</span></div></aside></div>`;
  lede=g?pick(g.mdAr,g.mdEn):'';
 } else {
  const secMap={governance:'governance',reports:'reports',assembly:'assembly'};
  const asideMap={
   governance:`<h4>${lang==='ar'?'بيانات الترخيص':'Licence details'}</h4><dl style="margin:0;font-size:.9rem">${[[lang==='ar'?'رقم الترخيص':'Licence no.',DB.settings.licence],[lang==='ar'?'الجهة المشرفة':'Supervising body',pick(DB.settings.authorityAr,DB.settings.authorityEn)],[lang==='ar'?'تاريخ التأسيس':'Founded',DB.settings.founded],[lang==='ar'?'المقر':'Headquarters',pick(DB.settings.hqAr,DB.settings.hqEn)]].map(([k,v])=>`<dt style="color:var(--muted);font-size:.8rem;margin-top:10px">${k}</dt><dd style="margin:0;font-weight:500">${esc(v)}</dd>`).join('')}</dl>`,
   reports:`<h4>${lang==='ar'?'ملخص 2024':'2024 summary'}</h4>${[[lang==='ar'?'إجمالي الإيرادات':'Total revenue',lang==='ar'?'4.2 م ر.س':'SAR 4.2M'],[lang==='ar'?'نسبة الصرف على البرامج':'Spent on programs','81%'],[lang==='ar'?'المستفيدون':'Beneficiaries','43,382']].map(([k,v])=>`<div style="font-size:.82rem;color:var(--muted);margin-bottom:12px">${k}<b style="display:block;font-size:1.5rem;font-weight:400;color:var(--ink)">${v}</b></div>`).join('')}`,
   assembly:`<h4>${lang==='ar'?'الاجتماع القادم':'Next meeting'}</h4><p>${lang==='ar'?'الجمعية العمومية العادية — 11 مارس 2027، مقر الجمعية بالرياض.':'Ordinary general assembly — 11 March 2027 at the Riyadh headquarters.'}</p>`};
  body=`<div class="split"><div>${docList(secMap[sub])}</div><aside class="aside rv">${asideMap[sub]}</aside></div>`;
 }
 return pageHead(s.about[sub],lede,[[s.nav.about,'about/identity'],[s.about[sub],'about/'+sub]])+nav+`<section><div class="wrap">${body}</div></section>`;
},

/* Upload — validation mirrors the API rules exactly (ADR-007) */
const OK_IMG=['image/jpeg','image/png','image/webp','image/avif'];
window.uploadFile=(file,thenPick)=>{
  if(!file)return;const s=t().admin;
  if(/svg/i.test(file.type)||/\.svg$/i.test(file.name)){toast(s.svgReject,true);return}
  const isPdf=file.type==='application/pdf';
  if(!isPdf&&!OK_IMG.includes(file.type)){toast(s.badType,true);return}
  const cap=isPdf?10485760:5242880;
  if(file.size>cap){toast(s.tooBig+' ('+kb(file.size)+' > '+kb(cap)+')',true);return}
  const key=uid();BLOBS[key]=URL.createObjectURL(file);
  const a={id:uid(),kind:isPdf?'pdf':'image',mime:file.type,size:file.size,name:file.name,blob:key,altAr:'',altEn:''};
  DB.assets.unshift(a);logAct((lang==='ar'?'رفع ملف: ':'Uploaded: ')+file.name);save();
  if(!isPdf){closeModal();editAsset(a.id,thenPick);}
  else{toast(s.saved);if(thenPick){pickAsset(a.id)}else{route()}}
};
window.addYoutube=()=>{
  const s=t().admin;
  openModal(`<div class="hd"><h3>${s.addYt}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="body"><div class="field"><label for="ytin">${s.fYt}</label><input id="ytin" dir="ltr" placeholder="${s.ytPh}"><span class="hint">${lang==='ar'?'يمكنك لصق الرابط كاملاً وسنستخرج المعرّف.':'Paste the full URL and we will extract the ID.'}</span></div></div>
  <div class="ft"><button class="btn btn-primary sm" onclick="saveYoutube()">${s.save}</button><button class="btn btn-ghost sm" onclick="closeModal()">${s.cancel}</button></div>`);
};
window.saveYoutube=()=>{
  const raw=(document.getElementById('ytin').value||'').trim();
  const m=raw.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/)||raw.match(/^([A-Za-z0-9_-]{11})$/);
  if(!m){toast(lang==='ar'?'معرّف YouTube غير صالح — 11 حرفاً.':'Invalid YouTube ID — 11 characters.',true);return}
  DB.assets.unshift({id:uid(),kind:'youtube',externalId:m[1],name:m[1]});
  logAct((lang==='ar'?'إضافة مقطع: ':'Added video: ')+m[1]);save();closeModal();toast(t().admin.saved);route();
};
window.editAsset=(id,thenPick)=>{

}
window.mdSync=fid=>{
  const el=document.getElementById(fid);if(!el)return;
  document.getElementById(fid+'-pv').innerHTML=md(el.value);
  document.getElementById(fid+'-ct').textContent=el.value.length+' '+t().admin.mdChars;
};
window.mdIns=(fid,pre,post)=>{
  const el=document.getElementById(fid);if(!el)return;
  const st=el.selectionStart,en=el.selectionEnd,sel=el.value.slice(st,en);
  el.value=el.value.slice(0,st)+pre+sel+post+el.value.slice(en);
  el.focus();el.selectionStart=st+pre.length;el.selectionEnd=st+pre.length+sel.length;
  mdSync(fid);
};
window.mdImage=fid=>{
  openPicker(id=>{
    if(!id)return;const a=asset(id);
    const el=document.getElementById(fid);if(!el)return;
    const snippet=`![${(a.altAr||'').replace(/[\[\]]/g,'')}](/media/${id}/file)`;
    const st=el.selectionStart;
    el.value=el.value.slice(0,st)+snippet+el.value.slice(st);
    mdSync(fid);
  },'image');
};

const owner=(k,id)=>k==='program'?DB.programs.find(x=>x.id===id):DB.posts.find(x=>x.id===id);

 o.atts.push({a,capAr:'',capEn:''});save();route()});

const COLL={cat:'categories',prog:'programs',post:'posts',vid:'videos',doc:'documents',partner:'partners',lead:'leadership',leadtype:'leadershipTypes',about:'aboutItems',page:'pages',chan:'channels',editor:'editors'};

function edOpen(kind,rec,isNew){DRAFT=JSON.parse(JSON.stringify(rec));DKIND=kind;DNEW=!!isNew;edRender()}
window.edCancel=()=>{DRAFT=null;DKIND=null;edRender()};
function edSync(){
  const f=document.getElementById('edForm');if(!f||!DRAFT)return;
  f.querySelectorAll('[name]').forEach(el=>{DRAFT[el.name]=el.type==='checkbox'?el.checked:el.value});
}
window.setD=(k,v)=>{edSync();DRAFT[k]=v;edRender()};
function edRender(){
  const h=document.getElementById('editor');if(!h)return;
  if(!DRAFT){h.innerHTML='';return}
  const a=t().admin;
  h.innerHTML=`<div class="edbox fade"><h3>${DNEW?a.newT:a.editT}</h3><form id="edForm" class="form" style="max-width:none" onsubmit="edSave(event)">${EDIT[DKIND]()}${edFoot()}</form></div>`;
  const first=h.querySelector('input:not([disabled]),select,textarea');if(first)first.focus();
  h.scrollIntoView({behavior:'smooth',block:'nearest'});
}
const edFoot=()=>{const a=t().admin;return `<div class="full" style="display:flex;gap:8px;padding-top:6px;border-top:1px solid var(--gray-2)"><button class="btn btn-primary sm" type="submit">${a.save}</button><button class="btn btn-ghost sm" type="button" onclick="edCancel()">${a.cancel}</button></div>`};

const fTxt=(n,l,o)=>{o=o||{};return `<div class="field${o.full?' full':''}"><label for="f_${n}">${l}${o.req?' *':''}</label><input id="f_${n}" name="${n}" value="${esc(DRAFT[n]??'')}"${o.dir?` dir="${o.dir}"`:''}${o.type?` type="${o.type}"`:''}${o.ro?' disabled':''}${o.ph?` placeholder="${esc(o.ph)}"`:''}>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`};
const fArea=(n,l,o)=>{o=o||{};return `<div class="field${o.full?' full':''}"><label for="f_${n}">${l}</label><textarea id="f_${n}" name="${n}" style="min-height:90px"${o.dir?` dir="${o.dir}"`:''}>${esc(DRAFT[n]??'')}</textarea>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`};
const fSel=(n,l,opts,o)=>{o=o||{};return `<div class="field${o.full?' full':''}"><label for="f_${n}">${l}${o.req?' *':''}</label><select id="f_${n}" name="${n}"${o.ro?' disabled':''}>${o.blank?`<option value="">— ${t().admin.none} —</option>`:''}${opts.map(([k,v])=>`<option value="${esc(k)}"${String(DRAFT[n]??'')===String(k)?' selected':''}>${esc(v)}</option>`).join('')}</select>${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`};
const fPub=()=>`<label class="chk"><input type="checkbox" name="pub"${DRAFT.pub?' checked':''}> ${t().admin.pub}</label>`;
const catOpts=sc=>catsOf(sc).map(c=>[c.id,pick(c.nameAr,c.nameEn)]);
const objOpts=o=>Object.entries(o);
const slugify=s=>String(s||'').trim().toLowerCase().replace(/[^\w؀-ۿ]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)||('item-'+uid());

 ${fTxt('nameEn',a.fName+' (English)',{dir:'ltr'})}

 ${fTxt('slug',a.fSlug,{dir:'ltr',ro:!DNEW,hint:DNEW?'':a.slugLock})}

lead(){const a=t().admin;
 // R2: type options come from the leadershipTypes tree, indented by depth so
 // an admin can tell a unit from its sub-unit in the dropdown.
 const flatTypes=(pid,depth)=>DB.leadershipTypes.filter(x=>x.parentId===(pid??null)).sort((x,y)=>x.sort-y.sort)
   .flatMap(ty=>[[ty,depth]].concat(flatTypes(ty.id,depth+1)));
 // Labels are passed RAW — fSel escapes them itself (same convention as
 // catOpts); escaping here too would double-escape any &/</>.
 const typeOpts=flatTypes(null,0).map(([ty,depth])=>[ty.id,'—'.repeat(depth)+(depth?' ':'')+pick(ty.nameAr,ty.nameEn)]);
 return `<div class="edgrid">
 <div class="adm-note warn full">⚠️ ${a.pdplWarn}</div>
 ${fTxt('nameAr',a.fName+' (عربي)',{req:true})}
 ${fTxt('nameEn',a.fName+' (English)',{dir:'ltr'})}
 ${fTxt('titleAr',a.fTitleAr,{req:true})}
 ${fTxt('titleEn',a.fTitleEn,{dir:'ltr'})}
 ${fSel('typeId',a.fKind,typeOpts,{req:true,blank:true})}
 ${assetField(a.fPhoto,DRAFT.photo,"v=>setD('photo',v)",'image')}
 ${fTxt('phone',a.fPhone,{dir:'ltr',ph:'05X XXX XXXX',hint:a.pdplWarn})}
 ${fTxt('email',a.fEmail,{dir:'ltr',type:'email'})}
 ${fArea('briefAr',a.fBrief+' (عربي)',{full:true})}
 ${fArea('briefEn',a.fBrief+' (English)',{dir:'ltr',full:true})}
 ${fPub()}</div>`},

leadtype(){const a=t().admin;
 // R2: parent options are the tree itself, minus this type and its own
 // descendants — picking a descendant as your own parent is exactly the
 // cycle edSave also rejects; excluding it here means the mistake is never
 // offered in the first place.
 const flatTypes=(pid,depth)=>DB.leadershipTypes.filter(x=>x.parentId===(pid??null)).sort((x,y)=>x.sort-y.sort)
   .flatMap(ty=>[[ty,depth]].concat(flatTypes(ty.id,depth+1)));
 // Labels are passed RAW — fSel escapes them itself.
 const opts=[['',a.topLevel]].concat(flatTypes(null,0)
   .filter(([ty])=>!leadTypeIsSelfOrDescendant(DRAFT.id,ty.id))
   .map(([ty,depth])=>[ty.id,'—'.repeat(depth)+(depth?' ':'')+pick(ty.nameAr,ty.nameEn)]));
 return `<div class="edgrid">
 ${fTxt('nameAr',a.fName+' (عربي)',{req:true})}
 ${fTxt('nameEn',a.fName+' (English)',{dir:'ltr'})}
 ${fSel('parentId',a.fParent,opts,{hint:a.depthErr})}
 ${fPub()}</div>`},

editor(){const a=t().admin;

 </div>`},
};

/* open handlers, called from the tables */
const maxSort=(arr,f)=>arr.filter(f||(()=>true)).reduce((m,x)=>Math.max(m,x.sort||0),0)+1;

window.editPost=id=>{const p=id?DB.posts.find(x=>x.id===id):null;edOpen('post',p||{id:uid(),slug:'',kind:'news',cat:'',thumb:null,titleAr:'',titleEn:'',exAr:'',exEn:'',bodyAr:'',bodyEn:'',date:new Date().toISOString().slice(0,10),atts:[],pub:false},!p)};
window.editVid=id=>{const v=id?DB.videos.find(x=>x.id===id):null;edOpen('vid',v||{id:uid(),cat:'',titleAr:'',titleEn:'',descAr:'',descEn:'',yt:'',dur:'',thumb:null,pub:false,sort:maxSort(DB.videos)},!v)};
window.editDoc=id=>{const d=id?DB.documents.find(x=>x.id===id):null;edOpen('doc',d||{id:uid(),sec:'governance',titleAr:'',titleEn:'',metaAr:'',metaEn:'',asset:null,pub:false,sort:1},!d)};
window.editPartner=id=>{const p=id?DB.partners.find(x=>x.id===id):null;edOpen('partner',p||{id:uid(),type:'executive',nameAr:'',nameEn:'',briefAr:'',briefEn:'',logo:null,url:'',year:'',pub:true,sort:maxSort(DB.partners)},!p)};
window.editLead=id=>{const l=id?DB.leadership.find(x=>x.id===id):null;edOpen('lead',l||{id:uid(),typeId:(DB.leadershipTypes[0]||{}).id||'',nameAr:'',nameEn:'',titleAr:'',titleEn:'',phone:'',email:'',briefAr:'',briefEn:'',photo:null,pub:true,sort:0},!l)};
window.editAbout=(id,kind)=>{const x=id?DB.aboutItems.find(i=>i.id===id):null;edOpen('about',x||{id:uid(),kind:kind||'value',titleAr:'',titleEn:'',bodyAr:'',bodyEn:'',sort:maxSort(DB.aboutItems,i=>i.kind===(kind||'value')),pub:true},!x)};

/* attachments operate on the draft, not the saved record */
window.attAdd=(k,id)=>openPicker(aid=>{
  if(!aid||!DRAFT)return;edSync();DRAFT.atts=DRAFT.atts||[];
  if(DRAFT.atts.some(x=>x.a===aid)){toast(lang==='ar'?'الملف مرفق بالفعل.':'Already attached.',true);return}
  DRAFT.atts.push({a:aid,capAr:'',capEn:''});edRender();
});
window.attDel=(k,id,i)=>{if(!DRAFT)return;edSync();DRAFT.atts.splice(i,1);edRender()};
window.attMove=(k,id,i,d)=>{if(!DRAFT)return;const j=i+d;if(j<0||j>=DRAFT.atts.length)return;edSync();[DRAFT.atts[i],DRAFT.atts[j]]=[DRAFT.atts[j],DRAFT.atts[i]];edRender()};
window.attCap=(k,id,i,v)=>{if(DRAFT&&DRAFT.atts[i])DRAFT.atts[i].capAr=v};

/* save */
window.edSave=e=>{
  e.preventDefault();edSync();
  const a=t().admin,d=DRAFT,k=DKIND,coll=COLL[k];
  const bad=(m,f)=>{toast(m,true);const el=f&&document.getElementById('f_'+f);if(el)el.focus();return false};
  const req=(f,l)=>{if(!String(d[f]||'').trim())return bad(l+' — '+a.req,f);return true};

  if(k==='cat'){
    if(!req('nameAr',a.fName))return;
    if(!String(d.slug||'').trim())d.slug=slugify(d.nameEn||d.nameAr);
    if(DB.categories.some(c=>c.id!==d.id&&c.scope===d.scope&&c.slug===d.slug))return bad(a.slugDup,'slug');
    if(DNEW)d.sort=maxSort(DB.categories,c=>c.scope===d.scope);
  }
  if(k==='prog'||k==='post'){
    if(!req('titleAr',a.fTitleAr))return;
    if(!d.cat)return bad(a.fCat+' — '+a.req,'cat');
    if(!String(d.slug||'').trim())d.slug=slugify(d.titleEn||d.titleAr);
    const other=(k==='prog'?DB.programs:DB.posts).some(x=>x.id!==d.id&&x.slug===d.slug);
    if(other)return bad(a.slugDup,'slug');
    if(k==='post'){
      if(!d.date)return bad(a.fDate+' — '+a.req,'date');
      if(d.pub&&!d.thumb)return bad(a.noThumb);
    }
    if(k==='prog'&&d.pub&&!d.thumb)toast(a.warnThumb,true);
  }
  if(k==='vid'){
    if(!req('titleAr',a.fTitleAr))return;
    if(!d.cat)return bad(a.fCat+' — '+a.req,'cat');
    if(d.yt){const m=String(d.yt).match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/)||String(d.yt).match(/^([A-Za-z0-9_-]{11})$/);
      if(!m)return bad(lang==='ar'?'معرّف YouTube غير صالح — 11 حرفاً.':'Invalid YouTube ID — 11 characters.','yt');d.yt=m[1]}
  }
  if(k==='doc'){
    if(!req('titleAr',a.fTitleAr))return;
    if(d.pub&&!d.asset)return bad(a.noFile);
    if(DNEW)d.sort=maxSort(DB.documents,x=>x.sec===d.sec);
  }
  if(k==='partner'&&!req('nameAr',a.fName))return;
  if(k==='lead'){
    if(!req('nameAr',a.fName))return;
    if(!req('titleAr',a.fTitleAr))return;
    if(!d.typeId)return bad(a.fKind+' — '+a.req,'typeId');
    if(DNEW)d.sort=maxSort(DB.leadership,x=>x.typeId===d.typeId);
  }
  if(k==='leadtype'){
    if(!req('nameAr',a.fName))return;
    // A blank <select> yields '', normalise to null so every "no parent"
    // row compares equal, whether it came from the seed or this form.
    d.parentId=d.parentId||null;
    if(d.parentId&&leadTypeIsSelfOrDescendant(d.id,d.parentId))return bad(a.cycleErr,'parentId');
    if(leadTypeDepthIfParent(d.parentId)+leadTypeSubtreeMaxDepth(d.id)>3)return bad(a.depthErr,'parentId');
    if(DNEW)d.sort=maxSort(DB.leadershipTypes,x=>x.parentId===d.parentId);
  }
  if((k==='about'||k==='page')&&!req('titleAr',a.fTitleAr))return;
  if(k==='chan'){if(!req('labelAr',a.fLabel))return;if(!req('value',a.fValue))return}
  if(k==='editor'){
    const prior=DB.editors.find(x=>x.id===d.id);
    if(!req('name',a.fName))return;
    if(!req('email',a.fEmail))return;
    if(DNEW&&!req('password',a.fPassword))return;
    if(!DNEW&&!String(d.password||'').trim())d.password=prior?prior.password:''; // blank on edit = leave unchanged
    if(DB.editors.some(x=>x.id!==d.id&&x.email.toLowerCase()===String(d.email||'').toLowerCase()))return bad(a.emailDup,'email');
    if(d.id===CURRENT_EDITOR_ID&&d.role!=='admin')return bad(a.cantDemoteSelf,'role');
    if(prior&&prior.role==='admin'&&d.role!=='admin'){
      const otherAdmins=DB.editors.filter(x=>x.role==='admin'&&x.id!==d.id).length;
      if(!otherAdmins)return bad(a.lastAdminErr,'role');
    }
  }

  const list=DB[coll],i=list.findIndex(x=>x.id===d.id);
  if(i<0)list.push(d);else list[i]=d;
  const label=d.titleAr||d.nameAr||d.labelAr||d.slug||d.name||'';
  logAct((DNEW?(lang==='ar'?'إضافة: ':'Added: '):(lang==='ar'?'تعديل: ':'Edited: '))+label);
  save();DRAFT=null;DKIND=null;toast(a.saved);route();
};

/* delete */
window.delRow=(coll,id)=>{
  const a=t().admin,rec=DB[coll].find(x=>x.id===id);if(!rec)return;
  openModal(`<div class="hd"><h3>${a.confirmT}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="body"><p>${a.confirmP}</p><p style="margin-top:10px;font-weight:500">${esc(rec.titleAr||rec.nameAr||rec.labelAr||'')}</p></div>
  <div class="ft"><button class="btn btn-danger sm" onclick="delGo('${coll}','${id}')">${a.yes}</button><button class="btn btn-ghost sm" onclick="closeModal()">${a.cancel}</button></div>`);
};
window.delGo=(coll,id)=>{
  const a=t().admin,rec=DB[coll].find(x=>x.id===id);
  DB[coll]=DB[coll].filter(x=>x.id!==id);
  logAct((lang==='ar'?'حذف: ':'Deleted: ')+(rec.titleAr||rec.nameAr||rec.labelAr||rec.name||''));
  save();closeModal();DRAFT=null;toast(a.deleted);route();
};
window.delLeadType=id=>{
  const a=t().admin,ty=leadType(id);if(!ty)return;
  const{members,children}=leadTypeRefs(id);
  if(members||children){
    const parts=[];
    if(members)parts.push(members+' '+a.membersT.toLowerCase());
    if(children)parts.push(children+' '+a.unitsW);
    return toast(a.cantDeleteType+' '+parts.join(lang==='ar'?' و':' and '),true);
  }
  DB.leadershipTypes=DB.leadershipTypes.filter(x=>x.id!==id);
  logAct((lang==='ar'?'حذف وحدة: ':'Deleted unit: ')+pick(ty.nameAr,ty.nameEn));save();toast(a.deleted);route();
};
window.delCat=id=>{
  const a=t().admin,n=catRefs(id),c=cat(id);
  if(n)return toast(a.cantDeleteCat+' '+n+' '+a.items,true);
  DB.categories=DB.categories.filter(x=>x.id!==id);
  logAct((lang==='ar'?'حذف تصنيف: ':'Deleted category: ')+(c?c.nameAr:''));save();toast(a.deleted);route();
};
window.delEditor=id=>{
  const a=t().admin,rec=DB.editors.find(x=>x.id===id);if(!rec)return;
  if(id===CURRENT_EDITOR_ID)return toast(a.cantDeleteSelf,true);
  if(rec.role==='admin'){
    const otherAdmins=DB.editors.filter(x=>x.role==='admin'&&x.id!==id).length;
    if(!otherAdmins)return toast(a.lastAdminErr,true);
  }
  openModal(`<div class="hd"><h3>${a.confirmT}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="body"><p>${a.confirmDeleteEditor}</p><p style="margin-top:10px;font-weight:500">${esc(rec.name)}</p></div>
  <div class="ft"><button class="btn btn-danger sm" onclick="delGo('editors','${id}')">${a.yes}</button><button class="btn btn-ghost sm" onclick="closeModal()">${a.cancel}</button></div>`);
};

/* reordering */
function swapSort(list,id,dir,same){
  const me=list.find(x=>x.id===id);if(!me)return;
  const sib=list.filter(x=>!same||same(x,me)).sort((x,y)=>x.sort-y.sort);
  const i=sib.indexOf(me),j=i+dir;if(j<0||j>=sib.length)return;
  const tmp=me.sort;me.sort=sib[j].sort;sib[j].sort=tmp;save();route();
}
window.catMove=(id,d)=>swapSort(DB.categories,id,d,(x,m)=>x.scope===m.scope);
window.aboutMove=(id,d)=>swapSort(DB.aboutItems,id,d,(x,m)=>x.kind===m.kind);
window.chanMove=(id,d)=>swapSort(DB.channels,id,d);
window.leadMove=(id,d)=>swapSort(DB.leadership,id,d,(x,m)=>x.typeId===m.typeId);
window.leadTypeMove=(id,d)=>swapSort(DB.leadershipTypes,id,d,(x,m)=>x.parentId===m.parentId);

/* accordion */
let accTimer=null;
window.accSel=i=>{
  const acc=document.getElementById('acc');if(!acc)return;
  [...acc.children].forEach((el,j)=>el.classList.toggle('on',i===j));
};
function accAuto(){
  clearInterval(accTimer);
  const acc=document.getElementById('acc');if(!acc||reduced())return;
  let i=0;const n=acc.children.length;if(n<2)return;
  let hover=false;
  acc.onmouseenter=()=>hover=true;acc.onmouseleave=()=>hover=false;
  accTimer=setInterval(()=>{if(hover||document.hidden)return;i=(i+1)%n;accSel(i)},3800);
}
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* scroll reveals + counters */
let io=null;
function countUp(el){
  const target=+el.dataset.count||0;
  if(reduced()){el.textContent=target.toLocaleString('en');return}
  const dur=1300,t0=performance.now();
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(target*e).toLocaleString('en');
    if(k<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function reveal(){
  if(io)io.disconnect();
  const els=document.querySelectorAll('.rv,.rv-stagger');
  const show=el=>{
    el.classList.add('in');
    el.querySelectorAll('[data-count]').forEach(n=>{if(!n.dataset.done){n.dataset.done='1';countUp(n)}});
  };
  document.querySelectorAll('[data-count]').forEach(n=>{if(!n.closest('.rv,.rv-stagger')&&!n.dataset.done){n.dataset.done='1';countUp(n)}});
  if(!('IntersectionObserver' in window)||reduced()){els.forEach(show);return}
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){show(en.target);io.unobserve(en.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
  els.forEach(el=>io.observe(el));
  /* safety net: anything already on screen must never stay invisible */
  const sweep=()=>document.querySelectorAll('.rv:not(.in),.rv-stagger:not(.in)').forEach(el=>{
    const r=el.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)show(el);
  });
  requestAnimationFrame(sweep);setTimeout(sweep,1500);
}
addEventListener('scroll',()=>{
  const h=document.documentElement,max=h.scrollHeight-h.clientHeight;
  const bar=document.getElementById('progress');
  if(bar)bar.style.width=(max>0?(h.scrollTop/max)*100:0)+'%';
},{passive:true});

/* ===================== router ===================== */
let lastPath='',curSec=null;
function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  const qi=raw.indexOf('?');
  const pathPart=qi<0?raw:raw.slice(0,qi);
  const q=new URLSearchParams(qi<0?'':raw.slice(qi+1));
  const segs=pathPart.split('/').filter(Boolean);
  if(segs[0]!=='ar'&&segs[0]!=='en'){location.replace('#/'+lang+'/');return}
  if(segs[0]!==lang){lang=segs[0];try{localStorage.setItem('t3-lang',lang)}catch(e){}}
  const p=segs.slice(1),r=p[0]||'';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  renderHeader();renderFooter();

  let html;
  if(r==='admin'){
    if(!admin){html=ADMIN.login();curSec=null}
    else{
      const sec=ADMIN[p[1]]&&p[1]!=='shell'&&p[1]!=='login'?p[1]:'overview';
      if(sec!==curSec){DRAFT=null;DKIND=null;curSec=sec}
      html=ADMIN.shell(sec,ADMIN[sec]());
    }
  } else {
    DRAFT=null;DKIND=null;curSec=null;
    switch(r){
      case '':html=PAGES.home();break;
      case 'about':html=PAGES.about(p[1]);break;
      case 'programs':html=PAGES.programs(p[1],q);break;
      case 'videos':html=PAGES.videos(q);break;
      case 'media':html=PAGES.media(p[1],p[2],q);break;
      case 'partners':html=PAGES.partners();break;
      case 'involve':html=PAGES.involve(p[1]);break;
      case 'donate':html=PAGES.donate();break;
      case 'contact':html=PAGES.contact();break;
      default:html=PAGES.notFound();
    }
  }
  const app=document.getElementById('app');
  app.innerHTML=html;
  setActive(r);
  document.getElementById('mnav').classList.remove('open');
  if(DRAFT)edRender();

  const key=pathPart;
  if(key!==lastPath){lastPath=key;window.scrollTo({top:0,behavior:'auto'})}
  document.title=(r===''?t().name:(app.querySelector('h1')?app.querySelector('h1').textContent.trim():t().name))+' · ta3lom.sa';
  reveal();accAuto();
}
addEventListener('hashchange',route);
if(!location.hash)location.replace('#/'+lang+'/');
route();
</script>
