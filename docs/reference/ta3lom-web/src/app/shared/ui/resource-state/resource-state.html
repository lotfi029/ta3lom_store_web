@if (loading()) {
  <p class="state">{{ i18n.pick('جارٍ التحميل…', 'Loading…') }}</p>
} @else if (error()) {
  <p class="state error">
    {{ errorMessage() ?? i18n.pick('تعذّر التحميل.', 'Could not load this.') }}
  </p>
  <p class="state-retry">
    <ta-button type="button" variant="ghost" size="sm" (click)="retry.emit()">
      {{ i18n.pick('إعادة المحاولة', 'Retry') }}
    </ta-button>
  </p>
} @else {
  <ng-content />
}
