<ta-dialog [open]="picker.isOpen()" labelledBy="media-picker-title" (closed)="onClosed()">
  <div class="picker-body">
    <div class="picker-head">
      <h2 id="media-picker-title">{{ title }}</h2>
      <!-- This dialog shipped with no way out but Escape — no close button at all — which is most
           of why "I can't exit the floating window" was reported against it. -->
      <button type="button" class="picker-close" (click)="onClosed()">
        <span aria-hidden="true">&#10005;</span>
        <span class="visually-hidden">{{ closeLabel }}</span>
      </button>
    </div>
    <!-- @if, not just the dialog's closed state, so this doesn't fetch/render a full hidden
         copy of the library for every page load — it exists only while actually open. -->
    @if (picker.isOpen()) {
      <ta-media-library [pickerMode]="true" [fixedKindFilter]="picker.filter() ?? null" (picked)="onPicked($event)" />
    }
  </div>
</ta-dialog>
