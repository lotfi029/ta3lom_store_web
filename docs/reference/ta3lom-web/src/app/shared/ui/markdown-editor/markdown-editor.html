<div class="md-editor">
  <span class="md-label" id="md-editor-label">{{ label() }}</span>
  @if (hint()) {
    <p class="field-hint">{{ hint() }}</p>
  }

  <!-- Mirrors the prototype's .md-wrap / .md-bar / .md-split / .md-foot exactly: one bordered
       card, the toolbar spanning its full width, the writing area and the live preview side by
       side beneath it, and a footer strip carrying the character count.
       The toolbar is Toast UI's own DOM inside #editorHost, so it cannot simply be moved above
       the split — base.css lays it across both columns instead. See the note there. -->
  <div class="md-wrap" role="group" [attr.aria-labelledby]="'md-editor-label'">
    <!-- data-md-host, not a class: base.css needs a hook to flatten this wrapper with
         `display: contents`, and a plain attribute says "this box exists only to hand Toast UI
         somewhere to mount" rather than implying it carries styling of its own. -->
    <div #editorHost data-md-host></div>
    <div class="md-prev prose" [innerHTML]="previewHtml()"></div>
    <div class="md-foot">
      <span [class.over]="overLimit()">
        {{ charCount() }} / {{ charLimit }} {{ i18n.pick('حرف', 'characters') }}
        @if (overLimit()) {
          <!-- Only the state CHANGE into over-limit is announced — the running count itself is not
               aria-live, which would announce on every keystroke. -->
          — <span aria-live="polite">{{ i18n.pick('تجاوزت الحد المسموح.', 'You have exceeded the allowed limit.') }}</span>
        }
      </span>
      <span>{{ i18n.pick('معاينة', 'Preview') }}</span>
    </div>
  </div>
</div>
