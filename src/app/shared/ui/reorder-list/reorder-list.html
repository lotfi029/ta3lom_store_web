<span class="visually-hidden" role="status" aria-live="polite">{{ announcement() }}</span>
<ol class="reorder-list" [attr.aria-label]="caption()" [attr.aria-busy]="busy() || null">
  @for (item of items(); track item.id; let i = $index, count = $count) {
    <li
      [attr.data-id]="item.id"
      [attr.draggable]="busy() ? 'false' : 'true'"
      (dragstart)="onDragStart(item.id)"
      (dragover)="onDragOver($event)"
      (drop)="onDrop(item.id)"
    >
      <span class="drag-handle" aria-hidden="true">⠿</span>
      <span class="item-content">
        <ng-container [ngTemplateOutlet]="itemTemplate()" [ngTemplateOutletContext]="{ $implicit: item }" />
      </span>
      <!-- aria-disabled, never `disabled`: a button that becomes disabled loses focus to <body>,
           which is exactly what happened when a move put an item at either end of the list, or
           while a save was in flight. move() ignores the press instead. -->
      <span class="reorder-buttons">
        <button
          type="button"
          data-move="up"
          aria-label="نقل للأعلى" i18n-aria-label="@@store.ui.move-up"
          [attr.aria-disabled]="busy() || i === 0 || null"
          (click)="move(i, -1)"
        >
          ↑
        </button>
        <button
          type="button"
          data-move="down"
          aria-label="نقل للأسفل" i18n-aria-label="@@store.ui.move-down"
          [attr.aria-disabled]="busy() || i === count - 1 || null"
          (click)="move(i, 1)"
        >
          ↓
        </button>
      </span>
    </li>
  }
</ol>
