<footer class="foot">
  <div class="wrap">
    <div class="grid">
      <div>
        <div class="foot-logo">
          <svg
            viewBox="380 320 1250 1350"
            role="img"
            aria-label="شعار جمعية التعلم الإلكتروني"
            i18n-aria-label="@@store.layout.logo-alt"
          >
            <use href="logo.svg#logo-src" />
          </svg>
        </div>
        <p i18n="@@store.layout.footer-about-r5">
          متجر تبرعات جمعية التعلم الإلكتروني: تبرعك يصل إلى المشروع أو التصنيف الذي تختاره.
        </p>
      </div>

      <div>
        <h2 class="fh" i18n="@@store.layout.footer-store">المتجر</h2>
        <a routerLink="/" fragment="projects" i18n="@@store.layout.nav-projects">المشاريع</a>
        <a routerLink="/cart" i18n="@@store.layout.nav-cart">السلة</a>
        <a routerLink="/account/donations" i18n="@@store.layout.my-donations">تبرعاتي</a>
      </div>

      <div>
        <h2 class="fh" i18n="@@store.layout.footer-association">الجمعية</h2>
        <a [href]="main" i18n="@@store.layout.main-site">الموقع الرئيسي</a>
        <a [href]="main + '/ar/about/identity'" i18n="@@store.layout.footer-about-link"
          >عن الجمعية</a
        >
        <a [href]="main + '/ar/privacy'" i18n="@@store.layout.footer-privacy">سياسة الخصوصية</a>
        <a [href]="main + '/ar/contact'" i18n="@@store.layout.footer-contact-link">تواصل معنا</a>
      </div>

      <div>
        <h2 class="fh" i18n="@@store.layout.footer-contact">تواصل</h2>
        <a class="mono" dir="ltr" href="mailto:store@ta3lom.sa">store&#64;ta3lom.sa</a>
      </div>
    </div>

    <div class="foot-bottom">
      <span
        ><bdi>©</bdi> {{ year }}
        <ng-container i18n="@@store.layout.association">جمعية التعلم الإلكتروني</ng-container></span
      >
    </div>
  </div>
</footer>
