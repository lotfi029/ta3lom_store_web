# Security headers shared by every environment — imported by deploy/Caddyfile (the container image, deploy/README.md).
# The Content-Security-Policy is NOT here: it is generated at build from the built pages (scripts/gen-csp.mjs →
# /etc/caddy/csp.conf, owner H-3) so its script hashes and API origin always match the image. HSTS is sent by the
# Caddyfile only when this server terminates TLS (TLS_MODE=direct, owner M-8).
header {
	X-Content-Type-Options "nosniff"
	Referrer-Policy "strict-origin-when-cross-origin"
	Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
	Cross-Origin-Opener-Policy "same-origin"
	-Server
}

# E-2: order pages carry the order's status token in the link — never leak it in a Referer.
@orders path /ar/orders/* /en/orders/*
header @orders Referrer-Policy "no-referrer"
