# Security headers shared by every environment — imported by deploy/Caddyfile (the container image, deploy/README.md).
# The Content-Security-Policy is NOT here: it is generated at build from the built pages (scripts/gen-csp.mjs →
# /etc/caddy/csp.conf, owner H-3) so its script hashes and API origin always match the image. HSTS is never sent here:
# the shared edge Caddy terminates TLS and sends it on the production names (owner M-8, review 06 L-6).
header {
	X-Content-Type-Options "nosniff"
	Referrer-Policy "strict-origin-when-cross-origin"
	Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
	Cross-Origin-Opener-Policy "same-origin"
}
# Own line, not inside the block above: a deletion makes a header block deferred, and deferred headers are dropped on
# the handle_errors path, so 404s lost every header above (review 06 L-1). The Caddyfile repeats it in handle_errors.
header -Server
