# Security headers for the static store web (https://store.ta3lom.sa) — import into the Caddy site block (hosting phase).
# THE Content-Security-Policy below is also the build gate's source of truth: scripts/check-csp.mjs fails the build when
# a built page has an inline script whose sha256 is not listed, when a listed hash is unused, or on any inline handler.
# script-src is hash-only (never 'unsafe-inline'): the pre-paint theme script and Angular's event-dispatch bootstrap.
header {
	Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zSqvmgMuMhIqFhxSZgJVjHU0wOQSWxj9iLyUfRvxzy8=' 'sha256-VM2mZqyEQZoLzoTrp5EigFvzQ0+f1wSeBuoOn95WHCg=' 'sha256-Rs1HrP+aChaQPyFHlpqUa6P+s+LjwwAYHdUOuT/gFnQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://store-api.ta3lom.sa; font-src 'self'; connect-src 'self' https://store-api.ta3lom.sa; media-src 'self' https://store-api.ta3lom.sa; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
	Strict-Transport-Security "max-age=31536000; includeSubDomains"
	X-Content-Type-Options "nosniff"
	Referrer-Policy "strict-origin-when-cross-origin"
	Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
	Cross-Origin-Opener-Policy "same-origin"
	-Server
}

# E-2: order pages carry the order's status token in the link — never leak it in a Referer.
@orders path /ar/orders/* /en/orders/*
header @orders Referrer-Policy "no-referrer"
